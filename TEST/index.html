<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI_Kokoro</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600&family=Noto+Serif+SC:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="bg-noise"></div>

    <div class="app">
      <aside class="sidebar">
        <div class="profile">
          <div class="avatar-wrap">
            <img
              id="avatarPreview"
              class="avatar"
              src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='100%25' height='100%25' fill='%231b1a12'/><text x='50%25' y='54%25' font-size='40' text-anchor='middle' fill='%23d7b74a' font-family='Arial'>AI</text></svg>"
              alt="头像预览"
            />
            <label class="upload-btn" for="avatarInput">上传头像</label>
            <input id="avatarInput" type="file" accept="image/*" />
          </div>
          <h1>AI_Kokoro</h1>
        </div>

        <div class="card api-card">
          <h2>API 输入</h2>
          <label class="field">
            <span>API Key</span>
            <input id="apiKey" type="password" placeholder="sk-xxxxxxxx" />
          </label>
          <label class="field">
            <span>API 地址</span>
            <input id="apiUrl" type="text" value="https://api.deepseek.com" readonly />
          </label>
          <button id="saveSettings" class="primary">保存设置</button>
        </div>

        <div class="card live2d-card">
          <h2>Live2D 形象</h2>
          <p class="helper">选择你的 Live2D 模型文件（JSON / MOC3 / ZIP）。</p>
          <label class="file-picker">
            <input id="live2dInput" type="file" accept=".json,.moc3,.zip" />
            <span class="file-btn">选择文件</span>
            <span id="live2dName" class="file-name">未选择文件</span>
          </label>
        </div>
      </aside>

      <main class="chat glass-panel">
        <header class="chat-header glass-capsule">
          <div>
            <h2>聊天空间</h2>
            <p>开始一段新的对话</p>
          </div>
          <button class="icon-btn" aria-label="新建对话">+</button>
        </header>

        <section id="chatList" class="chat-list custom-scrollbar mask-gradient">
          <div class="empty-state">
            <p>Chat with Kokoro</p>
          </div>
        </section>

        <footer class="chat-input glass-capsule">
          <textarea id="chatInput" rows="2" placeholder="输入消息，回车发送"></textarea>
          <button id="sendBtn" class="primary">发送</button>
        </footer>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
